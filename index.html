<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบจัดการร้านซักรีด</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16324f"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ร้านซักรีด">
<style>
:root{--ink:#16324f;--aq:#1aa7b5;--foam:#f1f7f9;--sun:#f2b632;--red:#d64545;--ok:#2e9e6a;--ln:#d5e3e8}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;background:var(--foam);color:var(--ink);font-size:18px;display:flex;height:100vh}
nav{width:190px;background:var(--ink);color:#fff;padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto}
nav .brand{display:flex;gap:8px;align-items:center;font-weight:700;padding:4px 6px 12px;font-size:17px}
nav .brand img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#fff}
nav button{background:none;border:0;color:#cfe3ea;text-align:left;padding:14px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--aq);color:#fff;font-weight:700}
main{flex:1;overflow:auto;padding:20px}
h1{margin:0 0 14px;font-size:26px}h2{font-size:20px;margin:18px 0 8px}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px}
.stat b{display:block;font-size:30px}.stat span{color:#5b7488;font-size:15px}
.big{border:0;border-radius:16px;padding:22px 10px;font:inherit;font-size:20px;font-weight:700;color:#fff;background:var(--aq);cursor:pointer}
.big.b2{background:var(--ink)}.big.b3{background:var(--sun);color:var(--ink)}.big.b4{background:var(--ok)}
.btn{border:0;background:var(--aq);color:#fff;padding:11px 18px;border-radius:10px;font:inherit;cursor:pointer}
.btn.s{background:#e3eef2;color:var(--ink)}.btn.d{background:var(--red)}.btn.sm{padding:7px 12px;font-size:15px}
input,select{font:inherit;padding:11px;border:1px solid var(--ln);border-radius:10px;width:100%;background:#fff}
label{display:block;margin:10px 0 4px;font-size:15px;color:#5b7488}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
td,th{padding:10px;border-bottom:1px solid var(--ln);text-align:left;font-size:16px}th{background:#e3eef2}
.r{text-align:right}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;background:#e3eef2}.tag.w{background:#fde6b0}.tag.x{background:#f8d0d0}
.gt{background:#fff;border:2px solid var(--ln);border-radius:14px;padding:12px;text-align:center}
.gt.on{border-color:var(--aq);background:#e6f6f8}.gt .q{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.gt .q button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:24px}
.gt .q b{font-size:24px;min-width:28px}
.bar{position:sticky;bottom:-20px;background:var(--ink);color:#fff;border-radius:14px;padding:14px;margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.md{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
.md>div{background:#fff;border-radius:16px;padding:20px;width:min(480px,100%);max-height:92vh;overflow:auto}
#rc{width:72mm;font-size:13px;color:#000;background:#fff;padding:2mm;margin:0 auto;font-family:'Sarabun',Tahoma,sans-serif}
#rc .c{text-align:center}#rc img{max-width:40mm;max-height:22mm}#rc hr{border:0;border-top:1px dashed #000}
#rc .l{display:flex;justify-content:space-between;gap:6px}
@media print{@page{size:80mm auto;margin:2mm}body{display:block;background:#fff;height:auto}nav,main,.md>div>.noprint{display:none!important}.md{position:static;background:none;padding:0}.md>div{padding:0;width:auto;max-height:none;overflow:visible}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main>
<script>
const KEY='laundry_v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||{shop:{name:'ร้านซักรีด',phone:'',addr:'',logo:'',qr:'',tax:'',foot:'ขอบคุณที่ใช้บริการ'},
 garments:[['เสื้อ','ชิ้น',20],['เสื้อโปโล','ชิ้น',25],['กางเกงขาสั้น','ชิ้น',20],['กางเกงขายาว','ชิ้น',25],['ผ้ารีด','ชิ้น',10],['ซักรีด','ชิ้น',30],['ซักพับ','กก.',40],['ซักแห้ง','ชิ้น',80],['เครื่องนอน','ชิ้น',150]].map((a,i)=>({id:'g'+i,name:a[0],unit:a[1],price:a[2]})),
 packages:[{id:'p1',name:'รายเดือน 50 ชิ้น',type:'รายเดือน',pieces:50,price:700,days:30}],
 customers:[],orders:[],ledger:[],rc:[],seq:0};
db.garments.forEach(g=>{if(!g.unit)g.unit='ชิ้น'});
db.customers.forEach(c=>{if(c.line==null)c.line=''});
const UN=['ชิ้น','กก.'];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('บันทึกไม่ได้ พื้นที่เต็มหรือถูกบล็อก')}};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=d=>{d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const today=()=>ld(),addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ld(d)};
const fm=n=>Number(n||0).toLocaleString('th-TH'),dt=s=>s?s.split('-').reverse().join('/'):'-';
let tab='home',cart={},sel='',from=today().slice(0,8)+'01',to=today(),q='';
const TABS=[['home','หน้าหลัก'],['order','รับผ้า / คิดเงิน'],['cust','ลูกค้า'],['pkg','แพ็คเกจ'],['acct','บัญชี'],['set','ตั้งค่าร้าน']];
function go(t){tab=t;draw()}
function draw(){
 $('#nav').innerHTML=`<div class="brand">${db.shop.logo?`<img src="${db.shop.logo}">`:''}<span>${esc(db.shop.name)}</span></div>`+TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('#main').innerHTML=V[tab]();
}
const cust=id=>db.customers.find(c=>c.id==id);
const active=c=>c.pkgId&&c.left>0&&c.exp>=today();
// ---------- modal ----------
function modal(h){const m=document.createElement('div');m.className='md';m.innerHTML='<div>'+h+'</div>';document.body.appendChild(m);m.close=()=>m.remove();return m}
function form(title,fs,v,ok){
 const m=modal(`<h2 style="margin-top:0">${title}</h2>`+fs.map(f=>`<label>${f.l}</label>`+(f.t=='select'?`<select data-k="${f.k}">${f.o.map(o=>`<option ${o==v[f.k]?'selected':''}>${o}</option>`).join('')}</select>`:`<input data-k="${f.k}" type="${f.t||'text'}" value="${esc(v[f.k]??'')}">`)).join('')+`<div class="row" style="margin-top:16px"><button class="btn s sp" id="x">ยกเลิก</button><button class="btn sp" id="o">บันทึก</button></div>`);
 m.querySelector('#x').onclick=m.close;
 m.querySelector('#o').onclick=()=>{const o={};m.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.type=='number'?+e.value:e.value.trim());if(ok(o)!==false)m.close()};
}
// ---------- receipt ----------
function mkRc(r){r.no='R'+today().replace(/-/g,'').slice(2)+'-'+String(++db.seq).padStart(3,'0');r.date=today();r.time=new Date().toTimeString().slice(0,5);db.rc.push(r);return r}
function showRc(r){
 const s=db.shop;
 const m=modal(`<div id="rc"><div class="c">${s.logo?`<img src="${s.logo}"><br>`:''}<b style="font-size:16px">${esc(s.name)}</b><br>${s.phone?'โทร '+esc(s.phone)+'<br>':''}${esc(s.addr)}</div><hr>
 <div class="l"><span>เลขที่ ${r.no}</span><span>${dt(r.date)} ${r.time||''}</span></div>
 <div>ลูกค้า: <b>${esc(r.name)}</b>${r.phone?' ('+esc(r.phone)+')':''}</div><hr>
 ${r.lines.map(l=>`<div class="l"><span>${esc(l.t)}${l.q?' x'+l.q+(l.unit||''):''}</span><span>${l.price!=null?'@'+fm(l.price):''}</span></div>${l.note||l.a!==''?`<div class="l"><span style="font-size:12px;color:#444">${l.note||''}</span><span>${l.a===''?'':fm(l.a)+' บาท'}</span></div>`:''}`).join('')}<hr>
 <div class="l"><b>รวมเป็นเงิน</b><b>${fm(r.total)} บาท</b></div>
 ${r.left!=null?`<div class="l"><span>แพ็คเกจคงเหลือ</span><b>${r.left} ชิ้น</b></div>`:''}
 ${r.exp?`<div class="l"><span>หมดอายุ</span><span>${dt(r.exp)}</span></div>`:''}
 <hr>${s.qr?`<div class="c"><img src="${s.qr}"><br><small>สแกนเพื่อชำระเงิน</small></div><hr>`:''}<div class="c">${esc(s.foot)}</div></div>
 <div class="row noprint" style="margin-top:14px"><button class="btn s sp" id="x">ปิด</button><button class="btn sp" id="p">พิมพ์ใบเสร็จ 80mm</button></div>`);
 m.querySelector('#x').onclick=m.close;m.querySelector('#p').onclick=()=>window.print();
}
const reprint=id=>showRc(db.rc.find(r=>r.no==id));
// ---------- views ----------
const V={};
V.home=()=>{
 const t=today(),td=db.ledger.filter(l=>l.date==t),inc=td.filter(l=>l.type=='in').reduce((a,l)=>a+l.amt,0);
 const low=db.customers.filter(c=>c.pkgId&&(c.left<=5||c.exp<=addDays(3)));
 const rec=db.rc.slice(-6).reverse();
 return `<h1>สวัสดี ${esc(db.shop.name)}</h1>
 <div class="g g4"><button class="big" onclick="go('order')">รับผ้า / คิดเงิน</button><button class="big b4" onclick="go('cust')">ลูกค้า / ต่อแพ็คเกจ</button><button class="big b3" onclick="go('acct')">บัญชี</button><button class="big b2" onclick="go('pkg')">แพ็คเกจ</button></div>
 <div class="g g4" style="margin-top:14px"><div class="card stat"><b>${fm(inc)}</b><span>รายรับวันนี้ (บาท)</span></div><div class="card stat"><b>${db.rc.filter(r=>r.date==t&&r.kind=='order').length}</b><span>บิลรับผ้าวันนี้</span></div><div class="card stat"><b>${db.customers.filter(active).length}</b><span>ลูกค้าแพ็คเกจที่ใช้งานอยู่</span></div><div class="card stat"><b>${low.length}</b><span>ใกล้หมด/ใกล้หมดอายุ</span></div></div>
 <h2>ต้องติดตาม</h2>${low.length?`<div class="g g3">${low.map(c=>`<div class="card"><b>${esc(c.name)}</b><br>${esc(c.pkgName)}<br><span class="tag ${c.left<=0||c.exp<t?'x':'w'}">เหลือ ${c.left} ชิ้น</span> <span class="tag">ถึง ${dt(c.exp)}</span></div>`).join('')}</div>`:'<div class="card">ไม่มีรายการ</div>'}
 <h2>ใบเสร็จล่าสุด</h2>${rec.length?`<table>${rec.map(r=>`<tr><td>${r.no}</td><td>${esc(r.name)}</td><td class="r">${fm(r.total)} บาท</td><td class="r"><button class="btn sm s" onclick="reprint('${r.no}')">ดู/พิมพ์</button></td></tr>`).join('')}</table>`:'<div class="card">ยังไม่มีใบเสร็จ</div>'}`;
};
V.order=()=>{
 const c=cust(sel),pieceG=db.garments.filter(g=>g.unit!='กก.'),wtG=db.garments.filter(g=>g.unit=='กก.');
 const pcsTot=pieceG.reduce((a,g)=>a+(cart[g.id]||0),0),kgTot=wtG.reduce((a,g)=>a+(cart[g.id]||0),0),cl=calc();
 return `<h1>รับผ้า / คิดเงิน</h1>
 <label>ลูกค้า</label><select onchange="sel=this.value;draw()"><option value="">ลูกค้าทั่วไป (จ่ายรายวัน)</option>${db.customers.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.name)}${active(x)?' — เหลือ '+x.left+' ชิ้น':''}</option>`).join('')}</select>
 ${c&&active(c)?`<p><span class="tag">${esc(c.pkgName)}</span> คงเหลือ <b>${c.left}</b> ชิ้น ถึง ${dt(c.exp)}</p>`:c?'<p><span class="tag x">ไม่มีแพ็คเกจที่ใช้งานได้ — คิดราคาตามรายการ</span></p>':''}
 <h2>รายการคิดตามชิ้น${c&&active(c)?' (ใช้แพ็คเกจได้)':''}</h2><div class="g g3">${pieceG.map(g=>`<div class="gt ${cart[g.id]?'on':''}"><b>${esc(g.name)}</b><br><span style="font-size:14px">${fm(g.price)} บาท/ชิ้น</span><div class="q"><button onclick="qty('${g.id}',-1)">−</button><b>${cart[g.id]||0}</b><button onclick="qty('${g.id}',1)">+</button></div></div>`).join('')||'<div class="card">ยังไม่มีรายการ เพิ่มได้ในหน้าตั้งค่าร้าน</div>'}</div>
 ${wtG.length?`<h2>รายการคิดตามน้ำหนัก (กก.)</h2><div class="g g3">${wtG.map(g=>`<div class="gt ${cart[g.id]?'on':''}"><b>${esc(g.name)}</b><br><span style="font-size:14px">${fm(g.price)} บาท/กก.</span><div class="row" style="justify-content:center;margin-top:8px"><input type="number" min="0" step="0.1" style="text-align:center" value="${cart[g.id]||''}" placeholder="0" oninput="wqty('${g.id}',this.value)"></div></div>`).join('')}</div>`:''}
 <div class="bar"><span>รวม <b>${pcsTot}</b> ชิ้น${kgTot?' + '+kgTot+' กก.':''}</span>${cl.use?`<span>ใช้แพ็คเกจ ${cl.use} ชิ้น (เหลือ ${cl.left})</span>`:''}<span class="sp" style="font-size:24px;text-align:right">ต้องชำระ <b>${fm(cl.pay)}</b> บาท</span><button class="btn s" onclick="cart={};draw()">ล้าง</button><button class="btn" style="background:var(--sun);color:var(--ink);font-weight:700" onclick="checkout()">บันทึก + พิมพ์ใบเสร็จ</button></div>`;
};
function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];draw()}
function wqty(id,v){const n=parseFloat(v);if(n>0)cart[id]=n;else delete cart[id];draw()}
function calc(){
 const c=cust(sel),pieceG=db.garments.filter(g=>g.unit!='กก.'),wtG=db.garments.filter(g=>g.unit=='กก.');
 const pcsTot=pieceG.reduce((a,g)=>a+(cart[g.id]||0),0);
 const use=c&&active(c)?Math.min(c.left,pcsTot):0;
 let bud=use,pieceLines=[];
 pieceG.forEach(g=>{const q=cart[g.id]||0;if(!q)return;const u=Math.min(bud,q);bud-=u;const pay=q-u;pieceLines.push({g,q,used:u,pay,amt:pay*g.price})});
 const wtLines=wtG.filter(g=>cart[g.id]).map(g=>({g,q:cart[g.id],used:0,pay:cart[g.id],amt:cart[g.id]*g.price}));
 const lines=pieceLines.concat(wtLines),pay=lines.reduce((a,l)=>a+l.amt,0);
 return{lines,use,pay,left:c&&active(c)?c.left-use:null,any:lines.some(l=>l.q>0)};
}
function checkout(){
 const cl=calc();if(!cl.any)return alert('กรุณาเลือกจำนวนผ้าก่อน');
 const c=cust(sel);
 const lines=cl.lines.map(l=>({t:l.g.name,q:l.q,unit:l.g.unit,price:l.g.price,a:l.pay*l.g.price,note:l.used?`ใช้แพ็คเกจ ${l.used}${l.g.unit}, จ่าย ${l.pay}${l.g.unit}`:''}));
 if(c&&cl.use){c.left=cl.left}
 const r=mkRc({kind:'order',name:c?c.name:'ลูกค้าทั่วไป',phone:c?c.phone:'',lines,total:cl.pay,left:cl.left,exp:c&&active(c)||cl.use?c.exp:''});
 if(cl.pay>0)db.ledger.push({id:uid(),date:r.date,type:'in',title:'ซักรีด '+r.name+' ('+r.no+')',cat:'ค่าบริการซักรีด',amt:cl.pay,rc:r.no});
 save();cart={};draw();showRc(r);
}
V.cust=()=>{
 const l=db.customers.filter(c=>(c.name+c.phone+(c.line||'')).includes(q));
 return `<h1>ลูกค้า</h1><div class="row"><input class="sp" placeholder="ค้นหาชื่อ / เบอร์ / ไลน์ไอดี" value="${esc(q)}" oninput="q=this.value;draw();const i=document.querySelector('main input');i.focus();i.setSelectionRange(99,99)"><button class="btn" onclick="editCust()">+ เพิ่มลูกค้า</button></div><br>
 ${l.length?`<table><tr><th>ชื่อ</th><th>เบอร์ / ไลน์ไอดี</th><th>แพ็คเกจ</th><th>เหลือ</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}${c.line?'<br><small>LINE: '+esc(c.line)+'</small>':''}</td><td>${c.pkgId?esc(c.pkgName)+'<br><small>ถึง '+dt(c.exp)+'</small>':'-'}</td><td>${c.pkgId?`<span class="tag ${active(c)?'':'x'}">${c.left} ชิ้น</span>`:'-'}</td><td class="r"><button class="btn sm" onclick="buyPkg('${c.id}')">ซื้อ/ต่อแพ็คเกจ</button> <button class="btn sm s" onclick="editCust('${c.id}')">แก้ไข</button></td></tr>`).join('')}</table>`:'<div class="card">ยังไม่มีลูกค้า</div>'}`;
};
function editCust(id){const c=id?cust(id):{};
 form(id?'แก้ไขลูกค้า':'เพิ่มลูกค้า',[{k:'name',l:'ชื่อลูกค้า'},{k:'phone',l:'เบอร์โทร'},{k:'line',l:'ไลน์ไอดี (ถ้ามี)'}].concat(id&&c.pkgId?[{k:'left',l:'จำนวนคงเหลือ (ชิ้น)',t:'number'},{k:'exp',l:'วันหมดอายุ',t:'date'}]:[]),c,o=>{
  if(!o.name){alert('กรุณาใส่ชื่อ');return false}
  if(id)Object.assign(c,o);else db.customers.push({id:uid(),name:o.name,phone:o.phone,line:o.line,pkgId:'',pkgName:'',left:0,exp:''});
  save();draw()});
 if(id){const m=document.querySelector('.md>div .row');const b=document.createElement('button');b.className='btn d';b.textContent='ลบ';b.onclick=()=>{if(confirm('ลบลูกค้านี้?')){db.customers=db.customers.filter(x=>x.id!=id);save();document.querySelector('.md').remove();draw()}};m.prepend(b)}
}
function buyPkg(id){
 const c=cust(id);if(!db.packages.length)return alert('ยังไม่มีแพ็คเกจ กรุณาเพิ่มในหน้าแพ็คเกจ');
 const m=modal(`<h2 style="margin-top:0">เลือกแพ็คเกจให้ ${esc(c.name)}</h2>${db.packages.map(p=>`<button class="btn s" style="width:100%;text-align:left;margin-bottom:8px" data-p="${p.id}"><b>${esc(p.name)}</b><br>${p.pieces} ชิ้น · ${p.days} วัน · ${fm(p.price)} บาท</button>`).join('')}<button class="btn s" id="x" style="width:100%">ยกเลิก</button>`);
 m.querySelector('#x').onclick=m.close;
 m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  const p=db.packages.find(x=>x.id==b.dataset.p);m.close();
  Object.assign(c,{pkgId:p.id,pkgName:p.name,left:p.pieces,exp:addDays(p.days)});
  const r=mkRc({kind:'pkg',name:c.name,phone:c.phone,lines:[{t:p.name,q:'',a:p.price},{t:p.pieces+' ชิ้น / '+p.days+' วัน',q:'',a:''}],total:p.price,left:c.left,exp:c.exp});
  db.ledger.push({id:uid(),date:r.date,type:'in',title:'แพ็คเกจ '+p.name+' - '+c.name+' ('+r.no+')',cat:'ค่าแพ็คเกจ',amt:p.price,rc:r.no});
  save();draw();showRc(r)});
}
V.pkg=()=>`<h1>แพ็คเกจ</h1><button class="btn" onclick="editPkg()">+ เพิ่มแพ็คเกจ</button><br><br>
 ${db.packages.length?`<table><tr><th>ชื่อ</th><th>ประเภท</th><th>ชิ้น</th><th>วัน</th><th class="r">ราคา</th><th></th></tr>${db.packages.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.type}</td><td>${p.pieces}</td><td>${p.days}</td><td class="r">${fm(p.price)}</td><td class="r"><button class="btn sm s" onclick="editPkg('${p.id}')">แก้ไข</button></td></tr>`).join('')}</table>`:'<div class="card">ยังไม่มีแพ็คเกจ</div>'}
 <p style="color:#5b7488">ลูกค้าทั่วไป/รายวัน คิดตามราคาต่อชิ้นในหน้า "ตั้งค่าร้าน"</p>`;
function editPkg(id){const p=id?db.packages.find(x=>x.id==id):{type:'รายเดือน',days:30};
 form(id?'แก้ไขแพ็คเกจ':'เพิ่มแพ็คเกจ',[{k:'name',l:'ชื่อแพ็คเกจ (เช่น รายเดือน 50 ชิ้น)'},{k:'type',l:'ประเภท',t:'select',o:['รายเดือน','รายวัน','อื่นๆ']},{k:'pieces',l:'จำนวนชิ้น',t:'number'},{k:'price',l:'ราคา (บาท)',t:'number'},{k:'days',l:'ใช้ได้กี่วัน',t:'number'}],p,o=>{
  if(!o.name||!(o.pieces>0)){alert('กรุณาใส่ชื่อและจำนวนชิ้น');return false}
  if(id)Object.assign(p,o);else db.packages.push({id:uid(),...o});save();draw()});
 if(id){const m=document.querySelector('.md>div .row');const b=document.createElement('button');b.className='btn d';b.textContent='ลบ';b.onclick=()=>{if(confirm('ลบแพ็คเกจนี้?')){db.packages=db.packages.filter(x=>x.id!=id);save();document.querySelector('.md').remove();draw()}};m.prepend(b)}
}
V.acct=()=>{
 const l=db.ledger.filter(x=>x.date>=from&&x.date<=to).sort((a,b)=>b.date.localeCompare(a.date)),i=l.filter(x=>x.type=='in').reduce((a,x)=>a+x.amt,0),o=l.filter(x=>x.type=='out').reduce((a,x)=>a+x.amt,0);
 return `<h1>บัญชี</h1><div class="row"><div><label>ตั้งแต่</label><input type="date" value="${from}" onchange="from=this.value;draw()"></div><div><label>ถึง</label><input type="date" value="${to}" onchange="to=this.value;draw()"></div><div class="sp"></div><button class="btn" onclick="addLed('in')">+ รายรับ</button><button class="btn d" onclick="addLed('out')">+ รายจ่าย</button></div>
 <div class="row" style="margin-top:10px"><span>ช่วงเวลาด่วน:</span><button class="btn sm s" onclick="setR(1)">เดือนนี้</button><button class="btn sm s" onclick="setR(3)">3 เดือน</button><button class="btn sm s" onclick="setR(12)">12 เดือน</button><div class="sp"></div><button class="btn s" onclick="csv()">ส่งออก Excel (CSV)</button><button class="btn s" onclick="report()">รายงานสรุป (พิมพ์/PDF)</button></div><br>
 <div class="g g4"><div class="card stat"><b style="color:var(--ok)">${fm(i)}</b><span>รายรับ</span></div><div class="card stat"><b style="color:var(--red)">${fm(o)}</b><span>รายจ่าย</span></div><div class="card stat"><b>${fm(i-o)}</b><span>คงเหลือสุทธิ</span></div></div><br>
 ${l.length?`<table><tr><th>วันที่</th><th>รายการ</th><th class="r">จำนวนเงิน</th><th></th></tr>${l.map(x=>`<tr><td>${dt(x.date)}</td><td>${esc(x.title)}<br><small style="color:#5b7488">${esc(x.cat||'')}</small></td><td class="r" style="color:${x.type=='in'?'var(--ok)':'var(--red)'}">${x.type=='in'?'+':'−'}${fm(x.amt)}</td><td class="r">${x.rc?`<button class="btn sm s" onclick="reprint('${x.rc}')">ใบเสร็จ</button> `:''}<button class="btn sm s" onclick="delLed('${x.id}')">ลบ</button></td></tr>`).join('')}</table>`:'<div class="card">ไม่มีรายการในช่วงนี้</div>'}`;
};
function addLed(t){form(t=='in'?'เพิ่มรายรับ':'เพิ่มรายจ่าย',[{k:'title',l:'รายการ'},{k:'cat',l:'หมวดหมู่',t:'select',o:t=='in'?CI:CO},{k:'amt',l:'จำนวนเงิน (บาท)',t:'number'},{k:'date',l:'วันที่',t:'date'}],{date:today()},o=>{
 if(!o.title||!(o.amt>0)){alert('กรุณาใส่รายการและจำนวนเงิน');return false}
 db.ledger.push({id:uid(),type:t,...o});save();draw()})}
function delLed(id){if(confirm('ลบรายการนี้?')){db.ledger=db.ledger.filter(x=>x.id!=id);save();draw()}}
V.set=()=>{const s=db.shop;return `<h1>ตั้งค่าร้าน</h1><div class="card"><div class="g g3" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
 <div><label>ชื่อร้าน</label><input value="${esc(s.name)}" onchange="db.shop.name=this.value;save();draw()"></div>
 <div><label>เลขประจำตัวผู้เสียภาษี (ถ้ามี)</label><input value="${esc(s.tax||'')}" onchange="db.shop.tax=this.value;save()"></div>
 <div><label>เบอร์โทรศัพท์</label><input value="${esc(s.phone)}" onchange="db.shop.phone=this.value;save()"></div>
 <div><label>ที่อยู่ (ถ้ามี)</label><input value="${esc(s.addr)}" onchange="db.shop.addr=this.value;save()"></div>
 <div><label>ข้อความท้ายใบเสร็จ</label><input value="${esc(s.foot)}" onchange="db.shop.foot=this.value;save()"></div>
 <div><label>โลโก้ร้าน</label><input type="file" accept="image/*" onchange="logo(this)">${s.logo?`<img src="${s.logo}" style="height:50px;margin-top:8px"> <button class="btn sm d" onclick="db.shop.logo='';save();draw()">ลบ</button>`:''}</div></div></div>
 <h2>ประเภทผ้า / บริการ และราคา</h2><div class="card">${db.garments.map(g=>`<div class="row" style="margin-bottom:8px"><input class="sp" value="${esc(g.name)}" onchange="gar('${g.id}','name',this.value)"><input type="number" style="width:100px" value="${g.price}" onchange="gar('${g.id}','price',+this.value)"><span style="min-width:70px">บาท/${g.unit}</span><select style="width:100px" onchange="gar('${g.id}','unit',this.value)">${UN.map(u=>`<option ${u==g.unit?'selected':''}>${u}</option>`).join('')}</select><button class="btn sm d" onclick="delGar('${g.id}')">ลบ</button></div>`).join('')}<button class="btn" onclick="db.garments.push({id:uid(),name:'รายการใหม่',unit:'ชิ้น',price:20});save();draw()">+ เพิ่มประเภทผ้า/บริการ</button></div>
 <p style="color:#5b7488">ตัวอย่างประเภทบริการ: ผ้ารีด, ซักรีด, ซักพับ (ตั้งหน่วยเป็น "กก."), ซักแห้ง, เครื่องนอน — รายการหน่วย "ชิ้น" ใช้หักจากแพ็คเกจได้ ส่วนหน่วย "กก." จะคิดราคาตามน้ำหนักเสมอ</p>
 <h2>QR โอนเงิน (ท้ายใบเสร็จ)</h2><div class="card"><input type="file" accept="image/*" onchange="qrimg(this)">${s.qr?`<br><img src="${s.qr}" style="height:120px;margin-top:8px"> <button class="btn sm d" onclick="db.shop.qr='';save();draw()">ลบ</button>`:''}</div>
 <h2>สำรองข้อมูล</h2><div class="card row"><button class="btn" onclick="backup()">ดาวน์โหลดไฟล์สำรอง</button><label class="btn s" style="margin:0;cursor:pointer">กู้คืนจากไฟล์<input type="file" accept=".json" hidden onchange="restore(this)"></label><span style="color:#5b7488;font-size:15px">ข้อมูลอยู่ในแท็บเล็ตเครื่องนี้ ควรสำรองสัปดาห์ละครั้ง</span></div>`};
function gar(id,k,v){db.garments.find(g=>g.id==id)[k]=v;save()}
function delGar(id){if(confirm('ลบประเภทนี้?')){db.garments=db.garments.filter(g=>g.id!=id);delete cart[id];save();draw()}}
function logo(el){const f=el.files[0];if(!f)return;const im=new Image,rd=new FileReader;rd.onload=()=>{im.onload=()=>{const k=Math.min(1,300/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);db.shop.logo=c.toDataURL('image/png');save();draw()};im.src=rd.result};rd.readAsDataURL(f)}
function qrimg(el){const f=el.files[0];if(!f)return;const im=new Image,rd=new FileReader;rd.onload=()=>{im.onload=()=>{const k=Math.min(1,500/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);db.shop.qr=c.toDataURL('image/png');save();draw()};im.src=rd.result};rd.readAsDataURL(f)}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='laundry-backup-'+today()+'.json';a.click()}
function restore(el){const f=el.files[0];if(!f||!confirm('ข้อมูลปัจจุบันจะถูกแทนที่ ต้องการดำเนินการต่อ?'))return;const rd=new FileReader;rd.onload=()=>{try{db=JSON.parse(rd.result);save();draw();alert('กู้คืนสำเร็จ')}catch(e){alert('ไฟล์ไม่ถูกต้อง')}};rd.readAsText(f)}
const CI=['ค่าบริการซักรีด','ค่าแพ็คเกจ','อื่นๆ'],CO=['ค่าน้ำยา/อุปกรณ์','ค่าน้ำ-ไฟ','ค่าเช่า','ค่าแรง','อื่นๆ'];
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const ymd=s=>{const[a,b,c]=s.split('-');return c+'/'+b+'/'+(+a+543)};
function setR(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(n-1));from=ld(d);to=today();draw()}
function stat(){
 const l=db.ledger.filter(x=>x.date>=from&&x.date<=to),ms={},ci={},co={};
 let y=+from.slice(0,4),m=+from.slice(5,7);const ey=+to.slice(0,4),em=+to.slice(5,7);
 while(y<ey||(y==ey&&m<=em)){ms[y+'-'+String(m).padStart(2,'0')]={i:0,o:0};if(++m>12){m=1;y++}}
 l.forEach(x=>{ms[x.date.slice(0,7)][x.type=='in'?'i':'o']+=x.amt;const c=x.type=='in'?ci:co,n=x.cat||'อื่นๆ';c[n]=(c[n]||0)+x.amt});
 return{l,ms,ci,co};
}
function csv(){
 const{l}=stat(),e=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=[['วันที่','เลขที่ใบเสร็จ','ประเภท','หมวดหมู่','รายการ','รายรับ','รายจ่าย']].concat(l.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[ymd(x.date),x.rc||'',x.type=='in'?'รายรับ':'รายจ่าย',x.cat||'',x.title,x.type=='in'?x.amt:'',x.type=='out'?x.amt:'']));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(e).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='accounts_'+from+'_to_'+to+'.csv';a.click();
}
function printA4(){const st=document.createElement('style');st.textContent='@page{size:A4;margin:12mm}';document.head.appendChild(st);window.onafterprint=()=>{st.remove();window.onafterprint=null};window.print()}
function report(){
 const{ms,ci,co}=stat(),s=db.shop,sum=o=>Object.values(o).reduce((a,b)=>a+b,0),I=sum(ci),O=sum(co),n=Object.keys(ms).length;
 const tr=(a,b,c,d,st)=>`<tr${st?' style="font-weight:700"':''}><td>${a}</td><td class="r">${b}</td>${c!=null?`<td class="r">${c}</td><td class="r">${d}</td>`:''}</tr>`;
 const m=modal(`<div id="rp" style="font-size:15px;color:#000"><h2 style="text-align:center;margin:0">รายงานสรุปรายรับ-รายจ่าย</h2>
 <p style="text-align:center;margin:4px 0 14px"><b>${esc(s.name)}</b>${s.tax?'<br>เลขประจำตัวผู้เสียภาษี '+esc(s.tax):''}${s.phone?'<br>โทร '+esc(s.phone):''}<br>ช่วงวันที่ ${ymd(from)} ถึง ${ymd(to)}</p>
 <table><tr><th>เดือน</th><th class="r">รายรับ</th><th class="r">รายจ่าย</th><th class="r">สุทธิ</th></tr>${Object.keys(ms).map(k=>{const v=ms[k];return tr(TM[+k.slice(5)-1]+' '+(+k.slice(0,4)+543),fm(v.i),fm(v.o),fm(v.i-v.o))}).join('')}${tr('รวม',fm(I),fm(O),fm(I-O),1)}</table>
 <h2>รายรับแยกตามหมวด</h2><table>${Object.keys(ci).map(k=>tr(esc(k),fm(ci[k]))).join('')||tr('-','')}${tr('รวมรายรับ',fm(I),null,null,1)}</table>
 <h2>รายจ่ายแยกตามหมวด</h2><table>${Object.keys(co).map(k=>tr(esc(k),fm(co[k]))).join('')||tr('-','')}${tr('รวมรายจ่าย',fm(O),null,null,1)}</table>
 <h2>ค่าเฉลี่ยต่อเดือน (${n} เดือน)</h2><table>${tr('รายรับเฉลี่ย',fm(Math.round(I/n)),null,null)}${tr('รายจ่ายเฉลี่ย',fm(Math.round(O/n)),null,null)}${tr('กำไรสุทธิเฉลี่ย',fm(Math.round((I-O)/n)),null,null,1)}</table>
 <p style="font-size:13px;color:#555;margin-top:14px">จัดทำจากบันทึกของร้าน วันที่พิมพ์ ${ymd(today())} (ปี พ.ศ.)</p></div>
 <div class="row noprint" style="margin-top:14px"><button class="btn s sp" id="x">ปิด</button><button class="btn sp" id="p">พิมพ์ / บันทึกเป็น PDF</button></div>`);
 m.firstChild.style.width='min(760px,100%)';m.querySelector('#x').onclick=m.close;m.querySelector('#p').onclick=printA4;
}
draw();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
